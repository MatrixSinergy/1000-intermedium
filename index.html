<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastery English - 1,000 Intermediate Words</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 25px; padding: 20px 0; }
    header h1 { font-size: 2rem; color: #1e1b4b; font-weight: 800; }
    header p { color: var(--text-muted); font-size: 1rem; margin-top: 5px; }

    /* Group Grid */
    .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 30px; }
    .group-pill {
      background: var(--card-bg); border: 2px solid var(--border); border-radius: var(--radius);
      padding: 14px 10px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative;
    }
    .group-pill:hover:not(.locked) { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1); }
    .group-pill.active { border-color: var(--primary); background: #eef2ff; }
    .group-pill.locked { opacity: 0.55; cursor: not-allowed; background: #f1f5f9; }
    .group-pill .badge { font-size: 0.75rem; font-weight: 700; color: var(--primary); text-transform: uppercase; }
    .group-pill.locked .badge { color: var(--text-muted); }
    .group-pill .status { font-size: 0.8rem; margin-top: 4px; font-weight: 600; }

    /* Main Workspace */
    .main-panel { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }

    .nav-tabs { display: flex; gap: 10px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
    .tab-btn {
      padding: 10px 18px; border: none; background: transparent; font-weight: 700; font-size: 0.95rem;
      color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* Intro View */
    .intro-box { background: #f8fafc; border-left: 4px solid var(--primary); padding: 18px; border-radius: 8px; margin-bottom: 20px; }
    .warning-box { background: #fef2f2; border-left: 4px solid var(--danger); padding: 15px; border-radius: 8px; margin-top: 15px; }

    /* Learning Space */
    .word-card {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 15px;
      transition: all 0.2s; background: white;
    }
    .word-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .word-title { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
    .word-pos { font-size: 0.8rem; color: var(--text-muted); font-style: italic; margin-left: 6px; }
    .audio-btn { background: #e0e7ff; color: var(--primary); border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .audio-btn:hover { background: #c7d2fe; }
    .word-meaning { font-size: 1.05rem; font-weight: 600; color: #1e293b; margin-bottom: 8px; }
    .collocation-box { background: #f1f5f9; padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 8px; }
    .example-sentence { color: #334155; font-size: 0.95rem; margin-top: 5px; }
    .example-translation { color: var(--text-muted); font-size: 0.85rem; font-style: italic; }

    /* Verification Gate */
    .quiz-card { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .quiz-card:last-child { border-bottom: none; }
    .quiz-q { font-weight: 700; margin-bottom: 12px; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .option-btn {
      padding: 12px; border: 1.5px solid var(--border); border-radius: 8px; background: white;
      text-align: left; cursor: pointer; font-weight: 500; font-size: 0.95rem; transition: 0.2s;
    }
    .option-btn:hover { border-color: var(--primary); background: #faf5ff; }
    .option-btn.selected { border-color: var(--primary); background: #eef2ff; color: var(--primary); font-weight: 700; }
    
    .primary-btn {
      background: var(--primary); color: white; border: none; padding: 14px 28px; border-radius: var(--radius);
      font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; transition: background 0.2s; margin-top: 15px;
    }
    .primary-btn:hover { background: var(--primary-hover); }

    .result-banner {
      padding: 20px; border-radius: var(--radius); text-align: center; margin-top: 20px; display: none;
    }
    .result-banner.pass { background: #dcfce7; color: #15803d; border: 2px solid #86efac; }
    .result-banner.fail { background: #fee2e2; color: #b91c1c; border: 2px solid #fca5a5; }

    .progress-bar-container { background: #e2e8f0; height: 10px; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
    .progress-bar-fill { background: var(--success); height: 100%; width: 10%; transition: width 0.3s; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Mastery English 1,000</h1>
    <p>Domina 1,000 palabras intermedias B1/B2 en 10 grupos de 100 palabras</p>
  </header>

  <div class="progress-bar-container">
    <div class="progress-bar-fill" id="global-progress"></div>
  </div>

  <!-- Groups Selector -->
  <div class="groups-grid" id="groups-grid"></div>

  <!-- Main Active Content Area -->
  <div class="main-panel">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('intro')">1. Introducción</button>
      <button class="tab-btn" onclick="switchTab('learn')">2. Espacio de Aprendizaje</button>
      <button class="tab-btn" onclick="switchTab('quiz')">3. Puerta de Verificación</button>
    </div>

    <!-- TAB 1: INTRO -->
    <div id="tab-intro" class="tab-content">
      <div class="intro-box">
        <h2 id="intro-title" style="margin-bottom: 8px;">Grupo 1</h2>
        <p id="intro-desc"></p>
      </div>
      <div class="warning-box">
        <strong>⚠️ Falsos Amigos (*False Friends*) y Errores Clave:</strong>
        <p id="intro-warnings" style="margin-top: 5px; font-size: 0.95rem;"></p>
      </div>
      <button class="primary-btn" onclick="switchTab('learn')">Comenzar a Estudiar este Grupo ➔</button>
    </div>

    <!-- TAB 2: LEARNING SPACE -->
    <div id="tab-learn" class="tab-content" style="display: none;">
      <div id="words-container"></div>
      <button class="primary-btn" onclick="switchTab('quiz')">Hacer el Examen de Verificación ➔</button>
    </div>

    <!-- TAB 3: QUIZ / VERIFICATION -->
    <div id="tab-quiz" class="tab-content" style="display: none;">
      <h3 style="margin-bottom: 5px;">Examen de Paso (Mastery Gate)</h3>
      <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">
        Debes obtener al menos un <strong>90% de aciertos</strong> para desbloquear el siguiente grupo.
      </p>
      <div id="quiz-container"></div>
      <button class="primary-btn" id="submit-quiz-btn" onclick="evaluateQuiz()">Enviar Examen y Verificar</button>

      <div id="quiz-result" class="result-banner"></div>
    </div>
  </div>
</div>

<script>
// --- COURSE DATA STORE (Organized into 10 groups of 100 words) ---
const courseData = [
  {
    id: 1,
    title: "Grupo 1: Acciones, Rutinas y Decisiones",
    description: "Este primer grupo contiene las palabras intermedias esenciales para expresar causas, acuerdos, consecuencias y estados emocionales cotidianos.",
    warnings: "Cuidado con 'Actually' (significa 'en realidad', no 'actualmente') y nunca digas 'I am agree' (se dice 'I agree').",
    words: [
      { word: "Abroad", pos: "adv.", meaning: "En el extranjero / fuera del país", collocation: "Study abroad / Go abroad", example: "He decided to study abroad for a year.", exTrans: "Decidió estudiar en el extranjero durante un año." },
      { word: "Achieve", pos: "v.", meaning: "Lograr, alcanzar (un objetivo)", collocation: "Achieve a goal / Achieve success", example: "With hard work, you will achieve your dreams.", exTrans: "Con trabajo duro, alcanzarás tus sueños." },
      { word: "Actually", pos: "adv.", meaning: "En realidad, de hecho", collocation: "Actually, I think...", example: "I thought he was British, but actually he is Canadian.", exTrans: "Pensé que era británico, pero en realidad es canadiense." },
      { word: "Affect", pos: "v.", meaning: "Afectar, influir negativamente o directamente", collocation: "Directly affect / Affect health", example: "Lack of sleep can severely affect your focus.", exTrans: "La falta de sueño puede afectar gravemente tu concentración." },
      { word: "Agree", pos: "v.", meaning: "Estar de acuerdo", collocation: "Agree with someone / Agree on a topic", example: "I totally agree with your proposal.", exTrans: "Estoy totalmente de acuerdo con tu propuesta." },
      { word: "Allow", pos: "v.", meaning: "Permitir, dar permiso", collocation: "Allow someone to do something", example: "My job allows me to work from home.", exTrans: "Mi trabajo me permite trabajar desde casa." },
      { word: "Amount", pos: "n.", meaning: "Cantidad (de algo incontable)", collocation: "A large amount of money / amount of time", example: "A huge amount of water was wasted.", exTrans: "Se desperdició una gran cantidad de agua." },
      { word: "Annoyed", pos: "adj.", meaning: "Molesto, irritado", collocation: "Get annoyed / Annoyed with someone", example: "She was annoyed because he didn't listen.", exTrans: "Estaba molesta porque él no escuchaba." },
      { word: "Anxious", pos: "adj.", meaning: "Ansioso, inquieto", collocation: "Feel anxious about something", example: "I feel anxious before speaking in public.", exTrans: "Me siento ansioso antes de hablar en público." },
      { word: "Apologize", pos: "v.", meaning: "Disculparse, pedir perdón", collocation: "Apologize for doing something", example: "You must apologize for being late.", exTrans: "Debes disculparte por llegar tarde." },
      { word: "Approach", pos: "n. / v.", meaning: "Enfoque, método / Acercarse", collocation: "A fresh approach / Approach a problem", example: "We need a new approach to solve this bug.", exTrans: "Necesitamos un nuevo enfoque para resolver este error." },
      { word: "Argue", pos: "v.", meaning: "Discutir, pelear verbalmente", collocation: "Argue with someone about something", example: "They always argue about trivial things.", exTrans: "Siempre discuten por cosas triviales." },
      { word: "Avoid", pos: "v.", meaning: "Evitar", collocation: "Avoid doing something / Avoid traffic", example: "Try to avoid eating junk food.", exTrans: "Intenta evitar comer comida chatarra." },
      { word: "Aware", pos: "adj.", meaning: "Consciente, enterado", collocation: "Be aware of risks / Fully aware", example: "Are you aware of the new company rules?", exTrans: "¿Estás al tanto de las nuevas normas de la empresa?" },
      { word: "Beat", pos: "v.", meaning: "Vencer, derrotar / Latir", collocation: "Beat an opponent / Beat the record", example: "Our team beat the champions yesterday.", exTrans: "Nuestro equipo venció a los campeones ayer." },
      { word: "Behavior", pos: "n.", meaning: "Comportamiento, conducta", collocation: "Good/bad behavior / Professional behavior", example: "His behavior during the meeting was exemplary.", exTrans: "Su comportamiento durante la reunión fue ejemplar." },
      { word: "Belong", pos: "v.", meaning: "Pertenecer", collocation: "Belong to someone", example: "Does this backpack belong to you?", exTrans: "¿Esta mochila te pertenece a ti?" },
      { word: "Blame", pos: "v. / n.", meaning: "Culpar / Culpa", collocation: "Blame someone for / Take the blame", example: "Don't blame others for your own mistakes.", exTrans: "No culpes a otros por tus propios errores." },
      { word: "Borrow", pos: "v.", meaning: "Pedir prestado (recibir)", collocation: "Borrow something from someone", example: "Can I borrow your laptop for an hour?", exTrans: "¿Puedo pedir prestada tu laptop por una hora?" },
      { word: "Bother", pos: "v.", meaning: "Molestar / Tomarse la molestia", collocation: "Don't bother / Bother someone", example: "I am sorry to bother you right now.", exTrans: "Siento molestarte en este momento." }
    ]
  },
  // Template groups 2 to 10 with pre-configured structure
  { id: 2, title: "Grupo 2: Negocios, Trabajo y Metas", description: "Vocabulario de oficina, proyectos y relaciones profesionales.", warnings: "Recuerda distinguir 'Career' (carrera profesional) de 'Degree' (carrera universitaria).", words: [] },
  { id: 3, title: "Grupo 3: Opiniones, Acuerdos y Debate", description: "Verbos y conectores para dar argumentos sólidos.", warnings: "Aprende el uso de 'consequently' y 'furthermore'.", words: [] },
  { id: 4, title: "Grupo 4: Sociedad, Tecnología y Mundo", description: "Términos sobre tendencias, sociedad, redes y avances.", warnings: "Distingue entre 'invention' y 'discovery'.", words: [] },
  { id: 5, title: "Grupo 5: Problemas y Soluciones", description: "Términos para describir fallas, riesgos y resoluciones.", warnings: "Falso amigo: 'compromise' significa 'llegar a un acuerdo', no compromiso formal.", words: [] },
  { id: 6, title: "Grupo 6: Viajes, Lugares y Cultura", description: "Vocabulario para desenvolverte en aeropuertos, hoteles y ciudades.", warnings: "Cuidado con 'embarrassed' (avergonzado, no embarazada).", words: [] },
  { id: 7, title: "Grupo 7: Tiempo, Rutinas y Planes", description: "Expresiones temporales y planificación de proyectos.", warnings: "Distingue entre 'schedule' y 'calendar'.", words: [] },
  { id: 8, title: "Grupo 8: Salud, Mente y Bienestar", description: "Expresiones sobre estado físico, hábitos y nutrición.", warnings: "Uso correcto de 'illness' vs 'disease'.", words: [] },
  { id: 9, title: "Grupo 9: Conceptos Abstractos y Éxito", description: "Palabras para hablar de suerte, esfuerzo, justicia y valores.", warnings: "Cuidado con 'success' (éxito) y 'exit' (salida).", words: [] },
  { id: 10, title: "Grupo 10: Phrasal Verbs y Expresiones B2", description: "Phrasal verbs y combinaciones idiomáticas que aportan fluidez nativa.", warnings: "Observa siempre si el phrasal verb es separable o inseparable.", words: [] }
];

// --- APP STATE ---
let currentGroupId = 1;
let unlockedGroups = JSON.parse(localStorage.getItem('unlockedGroups') || '[1]');
let userAnswers = {};

// --- INITIALIZATION ---
function initApp() {
  renderGroupPills();
  loadGroup(currentGroupId);
  updateProgressBar();
}

function renderGroupPills() {
  const grid = document.getElementById('groups-grid');
  grid.innerHTML = '';
  
  courseData.forEach(g => {
    const isUnlocked = unlockedGroups.includes(g.id);
    const pill = document.createElement('div');
    pill.className = `group-pill ${g.id === currentGroupId ? 'active' : ''} ${!isUnlocked ? 'locked' : ''}`;
    pill.onclick = () => { if (isUnlocked) selectGroup(g.id); };
    
    pill.innerHTML = `
      <div class="badge">${isUnlocked ? `Grupo ${g.id}` : '🔒 Bloqueado'}</div>
      <div class="status">${isUnlocked ? (unlockedGroups.includes(g.id + 1) ? '✓ Completado' : 'En Curso') : 'Supera grupo ' + (g.id - 1)}</div>
    `;
    grid.appendChild(pill);
  });
}

function selectGroup(id) {
  currentGroupId = id;
  renderGroupPills();
  loadGroup(id);
  switchTab('intro');
}

function loadGroup(id) {
  const group = courseData.find(g => g.id === id);
  if (!group) return;

  // Set Intro Tab
  document.getElementById('intro-title').innerText = group.title;
  document.getElementById('intro-desc').innerText = group.description;
  document.getElementById('intro-warnings').innerText = group.warnings;

  // Set Learning Space
  const wordsContainer = document.getElementById('words-container');
  wordsContainer.innerHTML = '';

  if (group.words.length === 0) {
    wordsContainer.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-muted);">
      Próximamente: Las palabras de este grupo se cargarán al superar el grupo anterior.
    </div>`;
  } else {
    group.words.forEach((w, index) => {
      const card = document.createElement('div');
      card.className = 'word-card';
      card.innerHTML = `
        <div class="word-header">
          <div>
            <span class="word-title">${index + 1}. ${w.word}</span>
            <span class="word-pos">${w.pos}</span>
          </div>
          <button class="audio-btn" onclick="speakWord('${w.word}')" title="Escuchar pronunciación">🔊</button>
        </div>
        <div class="word-meaning">${w.meaning}</div>
        <div class="collocation-box"><strong>Pareja clave:</strong> ${w.collocation}</div>
        <div class="example-sentence">"${w.example}"</div>
        <div class="example-translation">${w.exTrans}</div>
      `;
      wordsContainer.appendChild(card);
    });
  }

  // Set Verification Quiz
  setupQuiz(group);
}

// --- TEXT TO SPEECH (Native Audio) ---
function speakWord(text) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }
}

// --- QUIZ GENERATOR & LOGIC ---
function setupQuiz(group) {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  document.getElementById('quiz-result').style.display = 'none';
  userAnswers = {};

  if (group.words.length === 0) {
    container.innerHTML = `<p style="color: var(--text-muted);">Completa primero el grupo anterior.</p>`;
    document.getElementById('submit-quiz-btn').style.display = 'none';
    return;
  }
  document.getElementById('submit-quiz-btn').style.display = 'block';

  // Generate 10 test questions based on the words
  const questions = group.words.slice(0, 10).map((w, idx) => {
    // Generate 3 distractors
    const distractors = group.words.filter(item => item.word !== w.word)
      .sort(() => 0.5 - Math.random())
      .slice(0, 3)
      .map(item => item.meaning);
    
    const options = [...distractors, w.meaning].sort(() => 0.5 - Math.random());
    return { id: idx, word: w.word, correct: w.meaning, options: options, example: w.example.replace(new RegExp(w.word, 'gi'), '_____') };
  });

  questions.forEach((q, qIndex) => {
    const qDiv = document.createElement('div');
    qDiv.className = 'quiz-card';
    qDiv.innerHTML = `
      <div class="quiz-q">${qIndex + 1}. ¿Qué significa la palabra <strong>"${q.word}"</strong>? <br><small style="color: var(--text-muted); font-weight: normal;">En contexto: "${q.example}"</small></div>
      <div class="options-grid">
        ${q.options.map(opt => `
          <button type="button" class="option-btn" onclick="selectOption(${q.id}, '${opt.replace(/'/g, "\\'")}', this)">
            ${opt}
          </button>
        `).join('')}
      </div>
    `;
    container.appendChild(qDiv);
  });
}

function selectOption(qId, val, btn) {
  userAnswers[qId] = val;
  const parent = btn.parentElement;
  parent.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function evaluateQuiz() {
  const group = courseData.find(g => g.id === currentGroupId);
  const words = group.words.slice(0, 10);
  let correctCount = 0;

  words.forEach((w, idx) => {
    if (userAnswers[idx] === w.meaning) {
      correctCount++;
    }
  });

  const percentage = Math.round((correctCount / words.length) * 100);
  const resultDiv = document.getElementById('quiz-result');
  resultDiv.style.display = 'block';

  if (percentage >= 90) {
    resultDiv.className = 'result-banner pass';
    resultDiv.innerHTML = `
      <h3>🎉 ¡Excelente! Aprobaste con ${percentage}% (${correctCount}/${words.length})</h3>
      <p>Has dominado el Grupo ${currentGroupId}. ¡El siguiente grupo ha quedado desbloqueado!</p>
    `;
    // Unlock next group
    if (!unlockedGroups.includes(currentGroupId + 1) && currentGroupId < 10) {
      unlockedGroups.push(currentGroupId + 1);
      localStorage.setItem('unlockedGroups', JSON.stringify(unlockedGroups));
      renderGroupPills();
      updateProgressBar();
    }
  } else {
    resultDiv.className = 'result-banner fail';
    resultDiv.innerHTML = `
      <h3>Puntaje obtenido: ${percentage}% (${correctCount}/${words.length})</h3>
      <p>Necesitas al menos 90% para desbloquear el siguiente grupo. Revisa el Espacio de Aprendizaje e inténtalo de nuevo.</p>
    `;
  }
}

// --- TABS & NAVIGATION ---
function switchTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  
  if (tabName === 'intro') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('tab-intro').style.display = 'block';
  } else if (tabName === 'learn') {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('tab-learn').style.display = 'block';
  } else if (tabName === 'quiz') {
    document.querySelectorAll('.tab-btn')[2].classList.add('active');
    document.getElementById('tab-quiz').style.display = 'block';
  }
}

function updateProgressBar() {
  const percent = (unlockedGroups.length / 10) * 100;
  document.getElementById('global-progress').style.width = percent + '%';
}

// Start
initApp();
</script>
</body>
</html>
