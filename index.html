<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Inglés - Nivel Intermedio (1000 palabras)</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --danger: #EF4444;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --text-light: #6B7280;
            --locked: #9CA3AF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }

        .container { max-width: 1000px; width: 100%; }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--primary); font-size: 2.3rem; margin-bottom: 8px; }
        header p { color: var(--text-light); }

        /* Dashboard */
        .grid-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; }
        
        .group-card {
            background: var(--card-bg); border-radius: 12px; padding: 20px; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s, box-shadow 0.2s;
            position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
        }
        .group-card.unlocked:hover { transform: translateY(-5px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .group-card.locked { background: #E5E7EB; color: var(--locked); }
        
        .group-card h3 { font-size: 1.4rem; margin-bottom: 6px; }
        .group-card p { font-size: 0.9rem; color: var(--text-light); margin-bottom: 15px; }
        
        .btn {
            background: var(--primary); color: white; border: none; padding: 10px 18px;
            border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; width: 100%;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: var(--locked); cursor: not-allowed; }
        
        .badge {
            position: absolute; top: 10px; right: 10px; background: var(--success);
            color: white; font-size: 0.7rem; padding: 3px 8px; border-radius: 12px; font-weight: bold;
        }

        /* Views */
        .view { display: none; }
        .view.active { display: block; }

        /* Study Mode */
        .study-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .word-counter { font-size: 0.95rem; font-weight: 600; color: var(--text-light); }
        
        .flashcard {
            background: var(--card-bg); border-radius: 16px; padding: 40px 20px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); margin-bottom: 20px; min-height: 260px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;
        }
        .flashcard h2 { font-size: 2.8rem; color: var(--primary); margin-bottom: 15px; }
        .flashcard .translation { font-size: 1.8rem; color: var(--success); font-weight: bold; min-height: 40px; opacity: 0; transition: opacity 0.2s; }
        .flashcard .translation.show { opacity: 1; }
        
        .audio-icon-btn {
            background: #EEF2FF; border: none; color: var(--primary); border-radius: 50%;
            width: 44px; height: 44px; cursor: pointer; font-size: 1.2rem; margin-top: 10px;
            display: flex; align-items: center; justify-content: center; transition: background 0.2s;
        }
        .audio-icon-btn:hover { background: #E0E7FF; }

        .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px; }
        .btn-secondary { background: #E5E7EB; color: var(--text); }
        .btn-secondary:hover { background: #D1D5DB; }

        /* Exam Mode */
        .quiz-container { background: var(--card-bg); border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .progress-bar { width: 100%; height: 10px; background: #E5E7EB; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        
        .question { font-size: 1.4rem; margin-bottom: 20px; text-align: center; font-weight: 600; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .option-btn {
            padding: 14px; border: 2px solid #E5E7EB; border-radius: 8px; background: white;
            font-size: 1.05rem; cursor: pointer; transition: all 0.2s; text-align: left;
        }
        .option-btn:hover { border-color: var(--primary); background: #EEF2FF; }
        .option-btn.correct { background: #D1FAE5; border-color: var(--success); color: #065F46; font-weight: bold; }
        .option-btn.wrong { background: #FEE2E2; border-color: var(--danger); color: #991B1B; font-weight: bold; }
        .option-btn:disabled { cursor: not-allowed; }

        /* Results */
        .results { text-align: center; padding: 40px; }
        .results h2 { font-size: 2rem; margin-bottom: 20px; }
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 2rem; font-weight: bold; margin: 0 auto 20px auto; border: 8px solid;
        }
        .score-pass { border-color: var(--success); color: var(--success); }
        .score-fail { border-color: var(--danger); color: var(--danger); }

        @media (max-width: 600px) {
            .options { grid-template-columns: 1fr; }
            .flashcard h2 { font-size: 2.2rem; }
            .controls { flex-direction: column; width: 100%; }
            .controls .btn { width: 100% !important; }
        }
    </style>
</head>

<div class="container">
    <header>
        <h1>Inglés Intermedio 🇬🇧</h1>
        <p>1,000 palabras organizadas en 10 grupos. Aprueba el examen (80%) para desbloquear el siguiente.</p>
    </header>

    <!-- DASHBOARD -->
    <div id="dashboard" class="view active">
        <div class="grid-groups" id="groups-container"></div>
    </div>

    <!-- STUDY MODE -->
    <div id="study-view" class="view">
        <div class="study-header">
            <button class="btn btn-secondary" style="width: auto;" onclick="showDashboard()">← Volver al Menú</button>
            <div class="word-counter" id="study-counter">Palabra 1 de 100</div>
        </div>

        <div class="flashcard">
            <h2 id="study-word">Word</h2>
            <button class="audio-icon-btn" onclick="speakCurrentWord()" title="Escuchar pronunciación">🔊</button>
            <div class="translation" id="study-translation" style="margin-top: 15px;">Traducción</div>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" style="width: auto;" onclick="prevStudyWord()">← Anterior</button>
            <button class="btn" style="width: auto;" onclick="toggleTranslation()">Ver / Ocultar Traducción</button>
            <button class="btn btn-secondary" style="width: auto;" onclick="nextStudyWord()">Siguiente ➔</button>
        </div>
    </div>

    <!-- EXAM MODE -->
    <div id="exam-view" class="view">
        <div class="quiz-container">
            <div class="progress-bar"><div class="progress-fill" id="exam-progress"></div></div>
            <div class="question" id="question-text">Pregunta</div>
            <div class="options" id="options-container"></div>
        </div>
    </div>

    <!-- RESULTS VIEW -->
    <div id="results-view" class="view">
        <div class="quiz-container results">
            <h2 id="result-title">Resultado</h2>
            <div class="score-circle" id="result-score">0%</div>
            <p id="result-message" style="margin-bottom: 20px;"></p>
            <button class="btn" style="width: auto;" onclick="showDashboard()">Volver al Inicio</button>
        </div>
    </div>
</div>

    // Procesar datos de forma segura (ignora líneas vacías)
    const rawWords = rawString
        .split('\n')
        .map(line => line.trim())
        .filter(line => line.includes('|'))
        .map(line => {
            const [en, es] = line.split('|');
            return { en: en.trim(), es: es.trim() };
        });

    // Dividir en 10 grupos de 100
    const groups = [];
    for (let i = 0; i < 10; i++) {
        groups.push(rawWords.slice(i * 100, (i + 1) * 100));
    }

    // ==========================================
    // 2. LÓGICA DE LA APLICACIÓN
    // ==========================================

    let currentGroup = 0;
    let studyIndex = 0;
    let examQuestions = [];
    let currentQuestionIndex = 0;
    let correctAnswers = 0;

    let progress = JSON.parse(localStorage.getItem('englishProgress')) || { unlocked: 1 };

    const views = {
        dashboard: document.getElementById('dashboard'),
        study: document.getElementById('study-view'),
        exam: document.getElementById('exam-view'),
        results: document.getElementById('results-view')
    };

    function switchView(viewName) {
        Object.values(views).forEach(v => v.classList.remove('active'));
        views[viewName].classList.add('active');
    }

    function showDashboard() {
        switchView('dashboard');
        renderGroups();
    }

    function renderGroups() {
        const container = document.getElementById('groups-container');
        container.innerHTML = '';

        for (let i = 0; i < 10; i++) {
            const isUnlocked = (i + 1) <= progress.unlocked;
            const isCompleted = (i + 1) < progress.unlocked;

            const card = document.createElement('div');
            card.className = `group-card ${isUnlocked ? 'unlocked' : 'locked'}`;
            
            card.innerHTML = `
                ${isCompleted ? '<div class="badge">Completado</div>' : ''}
                <h3>Grupo ${i + 1}</h3>
                <p>${isUnlocked ? '100 palabras' : 'Bloqueado'}</p>
                <div style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
                    <button class="btn btn-secondary" ${!isUnlocked ? 'disabled' : ''} onclick="startStudy(${i})">📖 Estudiar</button>
                    <button class="btn" ${!isUnlocked ? 'disabled' : ''} onclick="startExam(${i})">📝 Examen</button>
                </div>
            `;
            container.appendChild(card);
        }
    }

    // MODO ESTUDIO
    function startStudy(groupIndex) {
        currentGroup = groupIndex;
        studyIndex = 0;
        switchView('study');
        renderStudyWord();
    }

    function renderStudyWord() {
        const word = groups[currentGroup][studyIndex];
        document.getElementById('study-word').innerText = word.en;
        const translationEl = document.getElementById('study-translation');
        translationEl.innerText = word.es;
        translationEl.classList.remove('show');
        
        document.getElementById('study-counter').innerText = `Palabra ${studyIndex + 1} de ${groups[currentGroup].length}`;
    }

    function toggleTranslation() {
        document.getElementById('study-translation').classList.toggle('show');
    }

    function nextStudyWord() {
        studyIndex = (studyIndex + 1) % groups[currentGroup].length;
        renderStudyWord();
    }

    function prevStudyWord() {
        studyIndex = (studyIndex - 1 + groups[currentGroup].length) % groups[currentGroup].length;
        renderStudyWord();
    }

    function speakCurrentWord() {
        const word = groups[currentGroup][studyIndex].en;
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    // MODO EXAMEN
    function startExam(groupIndex) {
        currentGroup = groupIndex;
        examQuestions = [];
        currentQuestionIndex = 0;
        correctAnswers = 0;

        const shuffled = [...groups[currentGroup]].sort(() => 0.5 - Math.random());
        examQuestions = shuffled.slice(0, 10).map(word => {
            const distractors = [...groups[currentGroup]]
                .filter(w => w.es !== word.es)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3)
                .map(w => w.es);
            
            const options = [word.es, ...distractors].sort(() => 0.5 - Math.random());
            return { question: word.en, correct: word.es, options: options };
        });

        switchView('exam');
        renderQuestion();
    }

    function renderQuestion() {
        const q = examQuestions[currentQuestionIndex];
        
        const progressPercent = (currentQuestionIndex / examQuestions.length) * 100;
        document.getElementById('exam-progress').style.width = `${progressPercent}%`;
        
        document.getElementById('question-text').innerText = `¿Cuál es la traducción de: "${q.question}"?`;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        q.options.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = () => selectAnswer(btn, option, q.correct);
            optionsContainer.appendChild(btn);
        });
    }

    function selectAnswer(btn, selected, correct) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        if (selected === correct) {
            btn.classList.add('correct');
            correctAnswers++;
        } else {
            btn.classList.add('wrong');
            allBtns.forEach(b => {
                if (b.innerText === correct) b.classList.add('correct');
            });
        }

        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < examQuestions.length) {
                renderQuestion();
            } else {
                finishExam();
            }
        }, 800);
    }

    function finishExam() {
        switchView('results');
        const score = (correctAnswers / examQuestions.length) * 100;
        
        const scoreEl = document.getElementById('result-score');
        const titleEl = document.getElementById('result-title');
        const msgEl = document.getElementById('result-message');

        scoreEl.innerText = `${score}%`;
        scoreEl.className = `score-circle ${score >= 80 ? 'score-pass' : 'score-fail'}`;

        if (score >= 80) {
            titleEl.innerText = "¡Aprobado! 🎉";
            msgEl.innerText = `Has acertado ${correctAnswers} de ${examQuestions.length}.`;
            
            if (currentGroup + 1 === progress.unlocked && progress.unlocked < 10) {
                progress.unlocked++;
                localStorage.setItem('englishProgress', JSON.stringify(progress));
                msgEl.innerText += " ¡Has desbloqueado el siguiente grupo!";
            }
        } else {
            titleEl.innerText = "No aprobado 😢";
            msgEl.innerText = `Has acertado ${correctAnswers} de ${examQuestions.length}. Necesitas al menos un 80% para pasar. ¡Sigue estudiando!`;
        }
    }

    // Iniciar
    renderGroups();
</script>
